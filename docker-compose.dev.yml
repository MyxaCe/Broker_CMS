# Локальный контур разработки: только инфраструктура.
#
# Само приложение здесь НЕ поднимается — оно запускается на машине, чтобы цикл
# «правка → тест» не проходил через сборку образа. Docker отвечает за то, что
# нельзя поставить локально без последствий: БД, кеш, объектное хранилище.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down          # остановить
#   docker compose -f docker-compose.dev.yml down -v       # и стереть данные
#
# Порты намеренно смещены относительно стандартных: на машине уже может стоять
# свой Postgres или Redis, и молчаливый конфликт портов диагностируется хуже,
# чем явное отличие.

name: broker-cms-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: broker_cms_v2
      POSTGRES_USER: cms
      # Локальный контур, значение фиксированное и совпадает с .env.example.
      # Настоящие секреты живут вне репозитория (ТЗ разд. 6).
      POSTGRES_PASSWORD: dev_only_not_a_secret
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d broker_cms_v2']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Кеш выдачи и rate limit (ТЗ разд. 9).
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Шина событий (ТЗ 3.5). vhost и имя обменника повторяют контур платформы,
  # чтобы локальная разработка не расходилась с ним в мелочах.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cms
      RABBITMQ_DEFAULT_PASS: dev_only_not_a_secret
      RABBITMQ_DEFAULT_VHOST: platform
    ports:
      - '5673:5672'
      - '15673:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20

  # S3-совместимое хранилище медиа (ТЗ 5.3).
  #
  # Раздача идёт с порта 9000, приложение живёт на 3001 — это разные origin,
  # что и требуется: загруженный файл не должен исполняться в origin админки.
  # Проверка этого условия встроена в валидацию окружения.
  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: cms_dev_access_key
      MINIO_ROOT_PASSWORD: dev_only_not_a_secret_32_chars_min
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Одноразовое создание бакета: без него первая загрузка медиа падает
  # с невнятной ошибкой доступа.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 cms_dev_access_key dev_only_not_a_secret_32_chars_min
        mc mb --ignore-existing local/broker-cms-media
        mc anonymous set download local/broker-cms-media
        echo "бакет broker-cms-media готов"
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
