name: CI

# ТЗ разд. 8: CI блокирует мёрж при падении ЛЮБОЙ проверки.
# Все проверки блокирующие с самого начала — вводить их «когда будет что
# проверять» поздно: правило перестаёт соблюдаться в первый же спорный момент.

# Прогон идёт на пуш в ЛЮБУЮ ветку, а не только в основную (CMS-18).
#
# Измерено до правки: все 50 прогонов репозитория с 30.07 — событие `push`,
# ветка `main`; на ветках ноль, по `pull_request` ноль. То есть тринадцать
# веток задач слились в основную, ни разу не будучи проверенными: прогон
# видел работу только ПОСЛЕ слияния, и ошибку чинили уже в общей истории.
#
# `pull_request` оставлен намеренно, хотя `push` по всем веткам его почти
# перекрывает. Он покрывает то, чего `push` не покрывает: ветку из форка и
# результат слияния, а не вершину ветки. Сегодня он не срабатывал ни разу
# (0 из 50), а ветки у нас свои — значит двойного прогона на практике нет.
# Появятся запросы на слияние изнутри репозитория — прогонов станет два, и
# это будет поводом решить, какой из них нужен, а не причиной убирать
# покрытие форков сейчас.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Проверки качества
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile обязателен: CI не имеет права молча разрешить
      # версии иначе, чем это сделал разработчик локально.
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линтер и границы модулей
        run: pnpm run lint

      - name: Форматирование
        run: pnpm run format:check

      - name: Типы
        run: pnpm run typecheck

      - name: Тесты
        run: pnpm run test

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: broker_cms_v2_test
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d broker_cms_v2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # Шина нужна по-настоящему: публикация с подтверждениями проверяется
      # против живого брокера, а не заглушки. Заглушка подтвердила бы что угодно.
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: cms
          RABBITMQ_DEFAULT_PASS: ci_only_not_a_secret
          RABBITMQ_DEFAULT_VHOST: platform
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      # Ограничение частоты запросов держит счётчик здесь. Заглушка проверила бы
      # только арифметику, а весь смысл ограничения — в хранилище, общем для
      # всех процессов.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Переменные задаются здесь, а не в .env: файлов окружения в репозитории нет
    # и быть не должно. Значения ниже — не секреты: контур существует только на
    # время прогона.
    #
    # Postgres, шина, Redis и объектное хранилище — настоящие сервисы, тесты
    # работают против них.
    #
    # ~~«Хранилище пока не используется, поэтому адрес никуда не ведёт»~~ —
    # утверждение перестало быть верным 06.10 (CMS-10, CMS-14): два набора
    # создают документы `media`, а это загрузка файла в S3. Прогон на main
    # краснел с 19.10, и красным был шаг, названный изоляцией тенантов
    # (CMS-19). Зачёркнуто, а не удалено: иначе исчезает и факт, что так было,
    # и дата снятия.
    #
    # Адрес MDS ведёт в пустоту сознательно: интеграционный прогон MDS не
    # опрашивает (синхронных обращений к нему нет по ТЗ 4.2). Это проверено
    # прогоном, а не рассуждением, и записано в src/ci-integration-services.test.ts.
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      APP_PUBLIC_URL: http://localhost:3001
      DATABASE_URL: postgres://cms:ci_only_not_a_secret@localhost:5432/broker_cms_v2_test
      REDIS_URL: redis://localhost:6379
      BUS_URL: amqp://cms:ci_only_not_a_secret@127.0.0.1:5672/platform
      BUS_EXCHANGE: platform.events
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central-1
      S3_BUCKET: broker-cms-media
      S3_ACCESS_KEY_ID: ci_only_access_key
      S3_SECRET_ACCESS_KEY: ci_only_not_a_secret_32_chars_min_
      MEDIA_PUBLIC_URL: http://localhost:9000
      MDS_HTTP_URL: http://localhost:3003
      SENTRY_DSN: https://ci-placeholder@localhost/0
      PAYLOAD_SECRET: ci_only_payload_secret_32_chars_min_
      PREVIEW_SECRET: ci_only_preview_secret_32_chars_min_
      DELIVERY_KEY_PEPPER: ci_only_delivery_pepper_32_chars_mi
      TRADING_TERMS_MODE: unverified

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Сгенерированные типы коммитятся. Если они разошлись с конфигурацией,
      # типы проверяются против устаревшего описания — проверка становится
      # декоративной. Расхождение должно роняться здесь, а не всплывать позже.
      - name: Типы коллекций не разошлись с конфигурацией
        run: |
          pnpm run generate:types
          git diff --exit-code -- src/payload-types.ts

      - name: Миграции
        run: pnpm run migrate:test

      # Объектное хранилище поднимается шагом, а не службой: `services:` не
      # умеет передавать команду контейнеру, а образу MinIO нужна `server /data`.
      #
      # Образ закреплён дайджестом, а не тегом: `:latest` делает версию
      # неустановимой, а тег можно передвинуть. Дайджест соответствует
      # RELEASE.2025-09-07T16-13-09Z — тому же образу, что в
      # docker-compose.dev.yml, чтобы контур разработки и прогон не расходились.
      #
      # Бакет создаётся здесь же: без него первая загрузка медиа падает с
      # невнятным отказом доступа. `mc` лежит внутри образа MinIO, второй образ
      # не нужен.
      - name: Хранилище медиа
        run: |
          set -euo pipefail
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci_only_access_key \
            -e MINIO_ROOT_PASSWORD=ci_only_not_a_secret_32_chars_min_ \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          # Ожидание и проверка — разные операции. Цикл только ждёт и молчит;
          # вердикт выносит отдельный запрос после него, и он роняет шаг.
          # Иначе отказ хранилища вышел бы наружу не красным шагом, а
          # «что-то долго» и падением тестов, которые про другое.
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null
          docker exec ci-minio mc alias set ci http://127.0.0.1:9000 \
            ci_only_access_key ci_only_not_a_secret_32_chars_min_
          docker exec ci-minio mc mb --ignore-existing ci/broker-cms-media
          docker exec ci-minio mc anonymous set download ci/broker-cms-media

      # Шаг гонит ВЕСЬ интеграционный набор, а не один файл про изоляцию.
      # Прежнее имя «Изоляция тенантов» утверждало больше, чем шаг знает:
      # любой отказ где угодно в наборе читался снаружи как нарушение границы
      # между тенантами — и три дня читался именно так (CMS-19).
      #
      # Доказательство критерия приёмки «редактор сайта A технически не может
      # прочитать или изменить данные сайта B» (ТЗ разд. 11) входит сюда
      # файлом src/platform/tenancy/isolation.integration.test.ts. Отдельным
      # шагом он не выносится намеренно: шаг, зовущий тесты путём, отстаёт от
      # набора молча — что считается прогоном, должен знать один файл.
      - name: Интеграционный набор целиком, включая изоляцию тенантов
        run: pnpm run test:integration

  audit:
    name: Аудит зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # ТЗ разд. 6: уязвимость в зависимости роняет сборку, а не попадает
      # в отчёт, который никто не читает.
      - name: Аудит
        run: pnpm audit --audit-level moderate
