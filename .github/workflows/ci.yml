name: CI

# ТЗ разд. 8: CI блокирует мёрж при падении ЛЮБОЙ проверки.
# Все проверки блокирующие с самого начала — вводить их «когда будет что
# проверять» поздно: правило перестаёт соблюдаться в первый же спорный момент.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Проверки качества
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile обязателен: CI не имеет права молча разрешить
      # версии иначе, чем это сделал разработчик локально.
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линтер и границы модулей
        run: pnpm run lint

      - name: Форматирование
        run: pnpm run format:check

      - name: Типы
        run: pnpm run typecheck

      - name: Тесты
        run: pnpm run test

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: broker_cms_v2_test
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d broker_cms_v2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Переменные задаются здесь, а не в .env: файлов окружения в репозитории нет
    # и быть не должно. Значения ниже — не секреты: контур существует только на
    # время прогона.
    #
    # Redis, шина и хранилище тестами не используются, но обязательны по
    # правилу fail-closed — процесс не стартует с неполной конфигурацией.
    # Поэтому здесь синтаксически корректные, но никуда не ведущие адреса.
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      APP_PUBLIC_URL: http://localhost:3001
      DATABASE_URL: postgres://cms:ci_only_not_a_secret@localhost:5432/broker_cms_v2_test
      REDIS_URL: redis://localhost:6379
      BUS_URL: amqp://cms:ci_only_not_a_secret@localhost:5672/platform
      BUS_EXCHANGE: platform.events
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central-1
      S3_BUCKET: broker-cms-media
      S3_ACCESS_KEY_ID: ci_only_access_key
      S3_SECRET_ACCESS_KEY: ci_only_not_a_secret_32_chars_min_
      MEDIA_PUBLIC_URL: http://localhost:9001
      MDS_HTTP_URL: http://localhost:3003
      SENTRY_DSN: https://ci-placeholder@localhost/0
      PAYLOAD_SECRET: ci_only_payload_secret_32_chars_min_
      PREVIEW_SECRET: ci_only_preview_secret_32_chars_min_
      DELIVERY_KEY_PEPPER: ci_only_delivery_pepper_32_chars_mi
      TRADING_TERMS_MODE: unverified

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Сгенерированные типы коммитятся. Если они разошлись с конфигурацией,
      # типы проверяются против устаревшего описания — проверка становится
      # декоративной. Расхождение должно роняться здесь, а не всплывать позже.
      - name: Типы коллекций не разошлись с конфигурацией
        run: |
          pnpm run generate:types
          git diff --exit-code -- src/payload-types.ts

      - name: Миграции
        run: pnpm run migrate:test

      # Доказательство критерия приёмки «редактор сайта A технически не может
      # прочитать или изменить данные сайта B» (ТЗ разд. 11).
      - name: Изоляция тенантов
        run: pnpm run test:integration

  audit:
    name: Аудит зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # ТЗ разд. 6: уязвимость в зависимости роняет сборку, а не попадает
      # в отчёт, который никто не читает.
      - name: Аудит
        run: pnpm audit --audit-level moderate
